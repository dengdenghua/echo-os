<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo 工作桌面</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:#263c51;font:18px system-ui,sans-serif;background:radial-gradient(ellipse at 8% 100%,#f3e5d9 0,transparent 54%),radial-gradient(ellipse at 94% 20%,#c7d8ec 0,transparent 62%),linear-gradient(155deg,#e9f1ec 0%,#d3e4ed 48%,#aabfdc 100%)}
body:before{content:"";position:absolute;inset:40% -20% -40%;border-radius:50%;background:linear-gradient(145deg,#ffffff55,#b8c9d522);transform:rotate(-14deg);box-shadow:0 -1px 0 #ffffff30;pointer-events:none}
header{position:relative;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;font-size:14px;color:#3b536aca}header strong{font-size:13px;letter-spacing:3px;font-weight:650}header time{font-variant-numeric:tabular-nums}
.welcome{position:absolute;inset:25% 0 auto;text-align:center}.welcome h1{font-size:86px;line-height:1.2;font-weight:300;letter-spacing:-4px;margin:0;color:#294760}.welcome p{font-size:20px;font-weight:400;color:#50677b;margin-top:14px}
.dock{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:9px 13px 8px;background:linear-gradient(135deg,#ffffff60,#ffffff10 65%),#eaf3f94d;border:1px solid #ffffffad;border-radius:24px;box-shadow:0 10px 24px #3e5f791c,inset 0 1px 1px #ffffffe0,inset 0 -1px 0 #3152731a;backdrop-filter:blur(18px) saturate(115%)}
button{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;border-radius:15px;color:#334c62;background:transparent;width:76px;padding:2px 5px 0;cursor:pointer;font:12px system-ui;transition:transform .16s,background .16s}button svg{width:52px;height:52px;overflow:visible;filter:drop-shadow(0 2px 3px #314c5a24)}button:hover{transform:translateY(-4px);background:#ffffff42}button:focus-visible{outline:3px solid #4279a1;outline-offset:3px}button:active{transform:translateY(-1px) scale(.96)}
@media(prefers-reduced-transparency:reduce){.dock{background:#e7eff3;backdrop-filter:none}}
@media(forced-colors:active){.dock{background:Canvas;border-color:CanvasText;box-shadow:none;backdrop-filter:none}button{color:CanvasText}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
<header><strong>ECHO</strong><time id="date"></time></header><div class="welcome"><h1 id="clock"></h1><p>留一点空间，给新的想法。</p></div>
<nav class="dock" aria-label="桌面应用">
<button data-app="browser" aria-label="浏览器"><svg viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="blue" x2="0" y2="1"><stop stop-color="#77c8f3"/><stop offset="1" stop-color="#347fce"/></linearGradient></defs><rect width="52" height="52" rx="13" fill="url(#blue)"/><circle cx="26" cy="26" r="17" fill="none" stroke="white" stroke-width="1.8"/><path d="M9 26h34M26 9c-11 10-11 24 0 34M26 9c11 10 11 24 0 34M13 16c8 5 18 5 26 0M13 36c8-5 18-5 26 0" fill="none" stroke="white" stroke-width="1.4" opacity=".9"/></svg><span>浏览器</span></button>
<button data-app="notes" aria-label="工作笔记"><svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="13" fill="#fffdf6"/><path d="M13 0h26a13 13 0 0 1 13 13v3H0v-3A13 13 0 0 1 13 0" fill="#e8bd6c"/><path d="M12 26h28M12 33h28M12 40h19" stroke="#b4b8b8" stroke-width="1.7" stroke-linecap="round"/></svg><span>工作笔记</span></button>
<button data-app="terminal" aria-label="终端"><svg viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="slate" x2="0" y2="1"><stop stop-color="#51677a"/><stop offset="1" stop-color="#293f52"/></linearGradient></defs><rect width="52" height="52" rx="13" fill="url(#slate)"/><path d="m13 17 9 8-9 8m13 1h12" fill="none" stroke="#f4f7fa" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>终端</span></button>
<button data-app="files" aria-label="文件"><svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="13" fill="#eaf6f7"/><path d="M7 16a4 4 0 0 1 4-4h11l4 5h15a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z" fill="#58aabd"/><path d="M7 23a3 3 0 0 1 3-3h32a3 3 0 0 1 3 3v15a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z" fill="#83c7d4"/><path d="M10 23h32" stroke="#b8e0e7" stroke-width="1.2" stroke-linecap="round"/></svg><span>文件</span></button>
</nav>
<script>const tick=()=>{const now=new Date();document.querySelector('#clock').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});document.querySelector('#date').textContent=now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});};tick();setInterval(tick,30000);document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>window.workDesktop.launch(b.dataset.app));</script></html>
