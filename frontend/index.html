<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo OS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#090a0c" />
    <style>
      :root {
        --startup-background: #090a0c;
        --startup-ink: #eef1f4;
        --startup-core: #6fe3f0;
        --startup-muted: #9aa3ae;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --startup-background: #eef0f3;
          --startup-ink: #111317;
          --startup-core: #08788a;
          --startup-muted: #59616c;
        }
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--startup-background);
      }

      body {
        outline: none;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .startup-loader {
        display: flex;
        flex-direction: column;
        gap: 22px;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--startup-background);
        opacity: 0;
        animation: echo-startup-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) 60ms
          forwards;
      }

      .startup-loader__mark {
        width: 56px;
        height: 56px;
      }

      .startup-loader__frame {
        stroke: var(--startup-ink);
      }

      .startup-loader__core {
        fill: var(--startup-core);
        filter: drop-shadow(0 0 6px var(--startup-core));
        animation: echo-core-breathe 2.4s ease-in-out infinite;
      }

      .startup-loader__label {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--startup-muted);
        font:
          500 10px/1 ui-monospace,
          "Cascadia Code",
          Consolas,
          monospace;
        letter-spacing: 0.24em;
      }

      .startup-loader__label svg {
        height: 10px;
      }

      .startup-loader__label path,
      .startup-loader__label rect {
        stroke: var(--startup-ink);
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loader {
          animation: none;
          opacity: 1;
        }
        .startup-loader__core {
          animation: none;
        }
      }

      @keyframes echo-startup-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes echo-core-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-loader" aria-hidden="true">
        <svg class="startup-loader__mark" viewBox="0 0 64 64" fill="none">
          <path
            class="startup-loader__frame"
            d="M50 17H24a7 7 0 0 0-7 7v16a7 7 0 0 0 7 7h26"
            stroke-width="6"
          />
          <circle class="startup-loader__core" cx="38" cy="32" r="5" />
        </svg>
        <div class="startup-loader__label">
          <svg viewBox="14 14 174 36" fill="none">
            <g stroke-width="6">
              <path d="M50 17H24a7 7 0 0 0-7 7v16a7 7 0 0 0 7 7h26" />
              <path d="M93 17H67a7 7 0 0 0-7 7v16a7 7 0 0 0 7 7h26" />
              <path d="M104 14v36M137 14v36M104 32h33" />
              <rect x="152" y="17" width="33" height="30" rx="7" />
            </g>
          </svg>
          <span>OS</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
